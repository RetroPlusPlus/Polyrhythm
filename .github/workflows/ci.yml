name: CI

# Push runs self-name from the commit message. A manual dispatch has no commit to name itself from,
# so it takes the branch. Derived, never authored — a hardcoded name goes stale the moment the run
# it was written for is over, and mislabels every dispatch after it.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('CI: {0}', github.ref_name) || '' }}"

# Triggers fire on ci/** in THIS repo only — not main, not pull_request.
# Source reaches main only via squash-merge from a ci/<branch> that already ran
# CI to green. This is the engine's own standalone pipeline (build mode 1); it is
# wholly independent of any consumer game's CI — separate repo, separate runs.
on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:
    inputs:
      capture_goldens:
        description: 'Capture + upload the golden fixtures for each backend (instead of comparing against committed ones)'
        type: boolean
        default: false

# These jobs read the repository and upload artifacts; they never write to it. Stating that here
# keeps the token read-only regardless of what the repository's default is set to later.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# SameBoy is vendored as a submodule and compiled into the engine (the GB/GBC core backs
# the VM host); checkout pulls it with submodules: recursive.

jobs:

  # ── Linux (beefserve, self-hosted, x64) ─────────────────────────────────────
  build-linux:
    name: Linux (beefserve, x64)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # A persistent build tree records the absolute source path it was generated for. When the
      # runner's work directory changes -- a different repository, a renamed runner -- that path no
      # longer matches and CMake refuses to configure at all. Discard the tree in exactly that case:
      # it is regenerable, and a matching path is left alone so the warm incremental build survives.
      - name: Discard a build tree generated for a different source path
        run: |
          BUILD=/tmp/retropp-engine-ci-build
          CACHE="$BUILD/CMakeCache.txt"
          if [ -f "$CACHE" ]; then
            SRC=$(grep -m1 '^CMAKE_HOME_DIRECTORY:INTERNAL=' "$CACHE" | cut -d= -f2-)
            if [ "$SRC" != "$GITHUB_WORKSPACE" ]; then
              echo "build tree was generated for '$SRC'; workspace is '$GITHUB_WORKSPACE' -- discarding"
              rm -rf "$BUILD"
            fi
          fi

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B /tmp/retropp-engine-ci-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build /tmp/retropp-engine-ci-build --parallel

      - name: Test
        run: |
          set -o pipefail   # without this, tee's exit code masks ctest failures
          export SDL_VIDEODRIVER=offscreen   # headless: SDL video init succeeds so the GPU device (lavapipe) is reachable
          if [ "${{ github.event.inputs.capture_goldens }}" = "true" ]; then export RETROPP_CAPTURE_GOLDEN=1; fi
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir /tmp/retropp-engine-ci-build -E HoldsHardwareCadenceLive --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-test-results.txt"

      # The rom-run example runs OUTSIDE the sweep so its measurements land in this log on every
      # run, pass or fail: the demo asserts each measured rate against its factor's target (--verify)
      # and a governor no longer holding wall-clock cadence turns this step red.
      - name: Rom-run cadence — the example runs, measurements captured
        run: |
          set -o pipefail
          ctest --test-dir /tmp/retropp-engine-ci-build -R HoldsHardwareCadenceLive --extra-verbose \
            2>&1 | tee -a "$GITHUB_WORKSPACE/ci-output/linux-test-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: ci-output/

      - name: Upload captured goldens
        if: ${{ github.event.inputs.capture_goldens == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-linux-x64
          path: tests/fixtures/golden/

  # ── macOS (ericmacmini, self-hosted, ARM64) ──────────────────────────────────
  build-macos:
    name: macOS (ericmacmini, ARM64)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # A persistent build tree records the absolute source path it was generated for. When the
      # runner's work directory changes -- a different repository, a renamed runner -- that path no
      # longer matches and CMake refuses to configure at all. Discard the tree in exactly that case:
      # it is regenerable, and a matching path is left alone so the warm incremental build survives.
      - name: Discard a build tree generated for a different source path
        run: |
          BUILD=/tmp/retropp-engine-ci-build
          CACHE="$BUILD/CMakeCache.txt"
          if [ -f "$CACHE" ]; then
            SRC=$(grep -m1 '^CMAKE_HOME_DIRECTORY:INTERNAL=' "$CACHE" | cut -d= -f2-)
            if [ "$SRC" != "$GITHUB_WORKSPACE" ]; then
              echo "build tree was generated for '$SRC'; workspace is '$GITHUB_WORKSPACE' -- discarding"
              rm -rf "$BUILD"
            fi
          fi

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B /tmp/retropp-engine-ci-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build /tmp/retropp-engine-ci-build --parallel

      - name: Test
        run: |
          set -o pipefail   # without this, tee's exit code masks ctest failures
          if [ "${{ github.event.inputs.capture_goldens }}" = "true" ]; then export RETROPP_CAPTURE_GOLDEN=1; fi
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir /tmp/retropp-engine-ci-build -E HoldsHardwareCadenceLive --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/macos-test-results.txt"

      # See the linux job's twin step: the example's measurements always land in this log, and the
      # demo's own --verify gate reds the step if a rate drifts off its factor's target.
      - name: Rom-run cadence — the example runs, measurements captured
        run: |
          set -o pipefail
          ctest --test-dir /tmp/retropp-engine-ci-build -R HoldsHardwareCadenceLive --extra-verbose \
            2>&1 | tee -a "$GITHUB_WORKSPACE/ci-output/macos-test-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: ci-output/

      - name: Upload captured goldens
        if: ${{ github.event.inputs.capture_goldens == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-macos
          path: tests/fixtures/golden/

  # ── Windows (self-hosted, x64) ───────────────────────────────────────────────
  build-windows-msvc:
    name: Windows clang-cl (x64)
    # Pinned to this machine by its name-label rather than the generic
    # [self-hosted, X64, Windows] set, so an ad-hoc Windows x64 runner joining the pool cannot pick up
    # general CI. The label is the one the runner actually carries — it is not the machine's hostname,
    # and the two differ by a character. Trade-off: if that machine is offline this job queues rather
    # than falling back.
    runs-on: [self-hosted, X64, Windows, Windows-BVDA560]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The build dir persists across runs (self-hosted) so builds are incremental — the same warm-build
      # posture as the Linux/macOS jobs. CMake re-runs configure itself when its inputs change.
      # A persistent build tree records the absolute source path it was generated for. When the
      # runner's work directory changes -- a different repository, a renamed runner -- that path no
      # longer matches and CMake refuses to configure at all. Discard the tree in exactly that case:
      # it is regenerable, and a matching path is left alone so the warm incremental build survives.
      - name: Discard a build tree generated for a different source path
        shell: powershell
        run: |
          $build = 'C:\retropp-engine-ci-build'
          $cache = Join-Path $build 'CMakeCache.txt'
          if (Test-Path $cache) {
            $line = Get-Content $cache | Where-Object { $_ -like 'CMAKE_HOME_DIRECTORY:INTERNAL=*' } | Select-Object -First 1
            $src = ''
            if ($line) { $src = $line.Substring($line.IndexOf('=') + 1) }
            $srcNorm = $src.Replace('\', '/')
            $ws = $env:GITHUB_WORKSPACE.Replace('\', '/')
            if ($srcNorm -ne $ws) {
              Write-Host "build tree was generated for '$srcNorm'; workspace is '$ws' - discarding"
              # Windows PowerShell's Remove-Item aborts the whole tree when one artifact is read-only
              # or still held open. Clear the attributes, then let rd do the delete -- it skips what it
              # cannot take rather than failing outright.
              $attrib = 'attrib -r -s -h "' + $build + '\*" /s /d'
              cmd /c $attrib 2>&1 | Out-Null
              $rd = 'rd /s /q "' + $build + '"'
              cmd /c $rd 2>&1 | Out-Null
              # A reconfigure only needs CMake's own state gone, so if anything survived, take that.
              if (Test-Path $cache) {
                Remove-Item -Force -ErrorAction SilentlyContinue $cache
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $build 'CMakeFiles')
              }
              if (Test-Path $cache) {
                Write-Error ('could not clear the stale build tree at ' + $build)
                exit 1
              }
              Write-Host 'stale build tree cleared'
            }
          }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\retropp-engine-ci-build `
            -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build
        shell: powershell
        run: cmake --build C:\retropp-engine-ci-build --config Release --parallel

      - name: Test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\ci-output | Out-Null
          # A held handle on the fixed results name has locked this step before; write a run-unique file
          # (and best-effort clear deletable stale ones) so a stale handle can never block the write.
          Get-ChildItem C:\ci-output\windows-test-results*.txt -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          if ("${{ github.event.inputs.capture_goldens }}" -eq "true") { $env:RETROPP_CAPTURE_GOLDEN = "1" }
          $results = "C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir C:\retropp-engine-ci-build -C Release -E HoldsHardwareCadenceLive --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # PowerShell equivalent of `set -o pipefail` — Tee-Object does not update
          # $LASTEXITCODE; the cmd /c exit code is captured after the pipeline.
          # Without this, ctest failures would silently report green.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # See the linux job's twin step: the example's measurements always land in this log, and the
      # demo's own --verify gate reds the step if a rate drifts off its factor's target.
      - name: Rom-run cadence — the example runs, measurements captured
        shell: powershell
        run: |
          $results = "C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir C:\retropp-engine-ci-build -C Release -R HoldsHardwareCadenceLive --extra-verbose 2>&1" |
            Tee-Object -FilePath $results -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt

      - name: Upload captured goldens
        if: ${{ github.event.inputs.capture_goldens == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-windows-x64
          path: tests/fixtures/golden/

  # ── Linux ARM64 (M1 Mac Mini VM, self-hosted) ───────────────────────────────
  # needs: build-macos so the M1 Mac Mini host serializes its ARM64 jobs.
  build-linux-arm64:
    name: Linux (M1 Mac Mini VM, ARM64)
